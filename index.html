<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cardápio digital da Brasa Nativa: monte seu pedido e envie pelo WhatsApp.">
<meta name="theme-color" content="#161615">
<meta property="og:type" content="website">
<meta property="og:title" content="Cardápio Brasa Nativa">
<meta property="og:description" content="Monte seu pedido no celular e envie pelo WhatsApp.">
<meta property="og:image" content="https://felipereolon14.github.io/cardapio/fotos/capa.jpg">
<meta property="og:url" content="https://felipereolon14.github.io/cardapio/">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cardápio Brasa Nativa</title>
<style>
/* Tokens neutros (a "estrutura"). Cor da marca, fontes e cantos vêm do visual escolhido em LOOKS, lá no script. */
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --surface-2:#ECEAE5; --ink:#161615; --ink-2:#6A6862; --line:#E2E0DA;
  --brand:#161615; --brand-ink:#FFFFFF; --accent:#9A6A2E; --accent-soft:#F1E6D6;
  --wa:#128C4A; --wa-ink:#FFFFFF; --bubble:#DCF3D2; --chat:#EFEDE8; --danger:#B3261E;
  --shadow:0 12px 32px -14px rgba(20,20,18,.45);
  --display:Georgia, "Times New Roman", serif; --display-weight:400; --display-tracking:0; --display-case:none;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius:18px; --radius-sm:12px;
  --col:520px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111110; --surface:#1B1B19; --surface-2:#262523; --ink:#F3F2EE; --ink-2:#A6A39C; --line:#2F2E2B;
    --brand:#F3F2EE; --brand-ink:#141413; --accent:#D8A661; --accent-soft:#35291A;
    --wa:#25B25F; --wa-ink:#04140A; --bubble:#173D28; --chat:#171716; --danger:#F2867D;
    --shadow:0 12px 32px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --surface:#1B1B19; --surface-2:#262523; --ink:#F3F2EE; --ink-2:#A6A39C; --line:#2F2E2B;
  --brand:#F3F2EE; --brand-ink:#141413; --accent:#D8A661; --accent-soft:#35291A;
  --wa:#25B25F; --wa-ink:#04140A; --bubble:#173D28; --chat:#171716; --danger:#F2867D;
  --shadow:0 12px 32px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--display);font-weight:var(--display-weight);letter-spacing:var(--display-tracking);text-transform:var(--display-case)}

#app{max-width:var(--col);margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 110px)}
#app.nonav{padding-bottom:140px}

/* ---------- Início ---------- */
.cover{position:relative;margin-inline:-16px;aspect-ratio:5/4;max-width:none;overflow:hidden;background:#222}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 45%,rgba(0,0,0,.78) 100%)}
.cover .status{position:absolute;z-index:1;left:16px;top:calc(14px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.94);color:#161615;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;display:flex;gap:7px;align-items:center}
.cover .status i{width:7px;height:7px;border-radius:50%;background:#16A34A;display:block}
.cover .id{position:absolute;z-index:1;left:16px;right:16px;bottom:18px;display:flex;gap:14px;align-items:center;color:#fff}
.logo{width:64px;height:64px;flex:none;border-radius:50%;background:var(--brand);display:grid;place-items:center;border:2px solid rgba(255,255,255,.85)}
.logo svg{width:34px;height:34px}
.cover h1{font-size:32px;line-height:1.02}
.cover p{margin:4px 0 0;font-size:14px;opacity:.9}
.infos{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.chip b{color:var(--ink)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 12px}
.sec h2{font-size:24px;line-height:1.1}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{position:relative;border:0;padding:0;border-radius:var(--radius);overflow:hidden;aspect-ratio:1/1;max-width:100%;background:var(--surface-2);text-align:left}
.cat img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.cat:hover img{transform:scale(1.05)}
.cat span{position:absolute;inset:auto 0 0 0;padding:40px 14px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75));color:#fff;display:flex;flex-direction:column}
.cat b{font-size:21px;line-height:1.1}
.cat small{font-size:12.5px;opacity:.85;margin-top:2px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 80%;scroll-snap-align:start}
.credit{margin:28px 0 0;text-align:center;font-size:12px;color:var(--ink-2)}

/* ---------- Card de prato: a foto manda ---------- */
.cards{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.card .ph{position:relative;display:block;width:100%;border:0;padding:0;aspect-ratio:16/11;background:var(--surface-2)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .flag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.95);color:#161615;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:99px}
.card .inbag{position:absolute;right:12px;top:12px;background:var(--brand);color:var(--brand-ink);font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px}
.card .cb{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;padding:14px 14px 16px}
.card .ct{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.card h3{font-size:17px;font-weight:700;line-height:1.25}
.card p{margin:0;color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .price{font-weight:700;font-size:16px;margin-top:4px}
.card .price small{font-weight:500;color:var(--ink-2);font-size:12.5px}
.add{width:52px;height:52px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none;transition:transform .15s}
.add:active{transform:scale(.92)}
.add svg{width:22px;height:22px}
.catnote{color:var(--ink-2);font-size:14px;margin:14px 0 8px}

/* ---------- Cabeçalho ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top h2{font-size:25px;flex:1;line-height:1.1}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}

/* ---------- Navegação + sacola flutuante ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
.dock > *{pointer-events:auto}
.dock-in{max-width:var(--col);margin:0 auto}
.fabwrap{display:flex;justify-content:flex-end;padding:0 16px 12px;pointer-events:none}
.fab{pointer-events:auto;position:relative;height:60px;min-width:60px;border:0;border-radius:99px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;box-shadow:var(--shadow);font-weight:700;font-size:15.5px}
.fab.empty{padding:0;width:60px}
.fab svg{width:24px;height:24px;flex:none}
.fab .badge{position:absolute;top:-4px;left:-4px;min-width:24px;height:24px;border-radius:99px;background:var(--accent);color:#fff;font-size:12.5px;display:grid;place-items:center;padding-inline:6px;border:2px solid var(--bg)}
.fab.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(1.12)}}
nav.tabs{background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .dock-in{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:6px}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-2);min-height:var(--nav-h)}
nav.tabs svg{width:23px;height:23px}
nav.tabs .ico{padding:4px 14px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ico{background:var(--surface-2)}

/* ---------- Detalhe (painel que sobe) ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.panel{position:relative;width:100%;max-width:var(--col);max-height:95%;background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(48px);opacity:.3}to{transform:none;opacity:1}}
.panel .scroll{overflow-y:auto;padding:0 16px 24px}
.hero{margin-inline:-16px;position:relative;aspect-ratio:1/1;max-height:58vh;width:calc(100% + 32px);max-width:none}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.8)}
.close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#161615;display:grid;place-items:center}
.close svg{width:20px;height:20px}
.dhead{padding:18px 0 2px}
.dhead h2{font-size:30px;line-height:1.05}
.dhead p{color:var(--ink-2);margin:8px 0 0;font-size:15px}
.dhead .price{font-weight:700;font-size:18px;margin-top:10px}
fieldset{border:0;margin:22px 0 0;padding:0}
legend{display:flex;justify-content:space-between;width:100%;align-items:center;font-weight:700;font-size:16px;padding:0 0 10px}
legend small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);padding:4px 8px;border-radius:6px}
legend small.req{color:var(--brand-ink);background:var(--brand)}
.opts{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.opt{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:54px;border-top:1px solid var(--line);cursor:pointer}
.opt:first-child{border-top:0}
.opt span{flex:1}
.opt em{font-style:normal;color:var(--ink-2);font-size:14px}
.opt input{width:22px;height:22px;accent-color:var(--brand);margin:0}
.opt:has(input:checked){background:var(--surface-2)}
label.fl{display:block;font-weight:700;margin:22px 0 8px}
label.fl span{font-weight:500;color:var(--ink-2)}
textarea,input[type=text],input[type=tel],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:14px;min-height:52px;resize:vertical;font-size:16px}
textarea{min-height:84px}
.foot{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg)}
.stepper button{width:48px;height:52px;border:0;background:none;display:grid;place-items:center}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper svg{width:18px;height:18px}
.stepper output{min-width:26px;text-align:center;font-weight:700;font-size:16px}
.stepper.sm button{width:44px;height:44px}
.primary{flex:1;border:0;border-radius:var(--radius-sm);background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;padding:0 18px;display:flex;justify-content:space-between;gap:10px;min-height:56px;align-items:center}

/* ---------- Carrinho ---------- */
.line{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.line img{width:64px;height:64px;border-radius:var(--radius-sm);object-fit:cover;display:block}
.line h3{font-size:16px;font-weight:700}
.line ul{margin:3px 0 0;padding:0;list-style:none;color:var(--ink-2);font-size:13.5px}
.line .lrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.line .lp{font-weight:700}
.more{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);font-weight:700;min-height:52px;padding:0}
.more svg{width:20px;height:20px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:var(--radius-sm);padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:calc(var(--radius-sm) - 3px);min-height:58px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px}
.seg button small{font-size:11.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 10px -4px rgba(0,0,0,.3)}
.err{color:var(--danger);font-size:13.5px;margin-top:6px;font-weight:600}
.hint{color:var(--ink-2);font-size:13px;margin-top:6px}
.totals{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.totals div{display:flex;justify-content:space-between}
.totals .t{font-weight:700;font-size:18px;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.fixedcta{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.fixedcta .dock-in{padding-inline:16px;display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:56px 10px;color:var(--ink-2)}
.empty h3{font-size:26px;color:var(--ink);margin-bottom:6px}
.empty .primary{margin:22px auto 0;max-width:260px;justify-content:center}

/* ---------- Confirmação ---------- */
.lead{color:var(--ink-2);margin:16px 0 0;font-size:15px}
.chat{margin-top:16px;background:var(--chat);border-radius:var(--radius);padding:14px;border:1px solid var(--line)}
.chat .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-bottom:12px}
.chat .who .logo{width:34px;height:34px;border-width:0}
.chat .who .logo svg{width:19px;height:19px}
.chat .who small{display:block;font-weight:500;color:var(--ink-2);font-size:12px}
.bubble{margin-left:auto;max-width:94%;background:var(--bubble);border-radius:14px 4px 14px 14px;padding:10px 12px 6px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bubble .meta{display:block;text-align:right;font-size:11px;color:var(--ink-2);margin-top:2px}
.wa{width:100%;border-radius:var(--radius);background:var(--wa);color:var(--wa-ink);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:18px;min-height:64px;padding:0 16px}
.wa svg{width:26px;height:26px;flex:none}
.help{margin-top:18px;font-size:14px;color:var(--ink-2)}
.help b{color:var(--ink);user-select:all}
.row2{display:flex;gap:10px;margin-top:12px}
.ghost{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);min-height:52px;font-weight:700}
.sentnote{margin-top:16px;background:var(--accent-soft);border-radius:var(--radius-sm);padding:12px 14px;font-size:14.5px}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:fade .25s ease;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes fade{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="look"></style>

</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="dock"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO DO RESTAURANTE — troque pelos dados reais
   ============================================================ */
const CONFIG = {
  restaurante: 'Brasa Nativa',
  slogan: 'Cozinha de brasa, ingredientes da estação.',
  horario: 'Aberto agora · até 23h',
  whatsapp: '5511999999999',          // país + DDD + número, só dígitos (número de exemplo)
  whatsappVisivel: '(11) 99999-9999',
  taxaEntrega: 7.00,
  visual: 'classico'                  // 'classico' | 'hamburgueria' | 'bistro'
};

/* ============================================================
   VISUAIS — cada um troca só cor, tipografia e cantos.
   Para testar outro sem mexer aqui: link + #hamburgueria ou #bistro
   ============================================================ */
const LOOKS = {
  classico: {
    fonts:'family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800',
    base:{display:'"Instrument Serif", Georgia, serif','display-weight':'400','display-tracking':'-0.01em','display-case':'none',
          body:'"Manrope", system-ui, sans-serif',radius:'18px','radius-sm':'12px'},
    light:{brand:'#161615','brand-ink':'#FFFFFF',accent:'#9A6A2E','accent-soft':'#F1E6D6'},
    dark:{brand:'#F3F2EE','brand-ink':'#141413',accent:'#D8A661','accent-soft':'#35291A'},
    logo:'#C9974F'
  },
  hamburgueria: {
    fonts:'family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600;700;800',
    base:{display:'"Bricolage Grotesque", "Arial Black", sans-serif','display-weight':'800','display-tracking':'-0.02em','display-case':'uppercase',
          body:'"Figtree", system-ui, sans-serif',radius:'26px','radius-sm':'16px'},
    light:{brand:'#D42A1C','brand-ink':'#FFFFFF',accent:'#E5A100','accent-soft':'#FCEFC7',bg:'#F7F4EF'},
    dark:{brand:'#FF5845','brand-ink':'#1A0604',accent:'#FFC233','accent-soft':'#3A2C0A'},
    logo:'#FFC233'
  },
  bistro: {
    fonts:'family=Cormorant+Garamond:wght@500;600&family=Karla:wght@400;500;600;700',
    base:{display:'"Cormorant Garamond", Garamond, Georgia, serif','display-weight':'600','display-tracking':'0','display-case':'none',
          body:'"Karla", system-ui, sans-serif',radius:'6px','radius-sm':'4px'},
    light:{brand:'#26382C','brand-ink':'#F5F1E6',accent:'#957340','accent-soft':'#EFE7D6'},
    dark:{brand:'#B7D1BD','brand-ink':'#0F1911',accent:'#CFAE72','accent-soft':'#322A1A'},
    logo:'#CFAE72'
  }
};

/* ---------- Cardápio ---------- */
const CATS = [
  {id:'entradas',   nome:'Entradas',   nota:'Pra beliscar enquanto a brasa trabalha.'},
  {id:'pratos',     nome:'Pratos',     nota:'Carnes na brasa servidas com arroz e vinagrete da casa.'},
  {id:'bebidas',    nome:'Bebidas',    nota:'Sucos da fruta, feitos na hora.'},
  {id:'sobremesas', nome:'Sobremesas', nota:'Doces feitos aqui, todos os dias.'}
];
const PONTO = {id:'ponto', label:'Ponto da carne', type:'one',
  choices:[['Mal passada'],['Ao ponto para mal'],['Ao ponto',0,true],['Ao ponto para bem'],['Bem passada']]};


const ITEMS = [
  {id:'pao', cat:'entradas', nome:'Pão de alho da casa', desc:'Pão de fermentação natural, manteiga de alho assado e salsinha. Vai pra brasa até dourar.', preco:18.9,
    groups:[{id:'add',label:'Adicionais',type:'many',choices:[['Queijo coalho derretido',6],['Pimenta biquinho',3]]}]},

const HASH = (location.hash||'').slice(1).toLowerCase();
const LOOK = LOOKS[HASH] || LOOKS[CONFIG.visual] || LOOKS.classico;
(function applyLook(){
  const v=o=>Object.entries(o).map(([k,x])=>`--${k}:${x}`).join(';');
  document.getElementById('look').textContent=
    `:root{${v(LOOK.base)};${v(LOOK.light)}}`+
    `@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${v(LOOK.dark)}}}`+
    `:root[data-theme="dark"]{${v(LOOK.dark)}}`;
  const l=document.createElement('link');l.rel='stylesheet';l.href=`https://fonts.googleapis.com/css2?${LOOK.fonts}&display=swap`;document.head.appendChild(l);

/* ---------- Estado (o pedido fica guardado no próprio celular) ---------- */
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = {view:'home', cat:'entradas', cart:[], mode:'mesa', mesa:'', nome:'', endereco:'', pagamento:'Pix', obs:'', errors:{}, sent:false};
try{const saved=JSON.parse(localStorage.getItem('bn-pedido')||'null');if(saved&&Array.isArray(saved.cart))Object.assign(S,saved,{view:'home',errors:{},sent:false})}catch(e){}
const mesaQR = HASH.match(/^mesa(\d{1,4})$/); if(mesaQR){S.mode='mesa';S.mesa=mesaQR[1]}
function save(){try{localStorage.setItem('bn-pedido',JSON.stringify({cart:S.cart,mode:S.mode,mesa:S.mesa,nome:S.nome,endereco:S.endereco,pagamento:S.pagamento,obs:S.obs}))}catch(e){}}

const count = () => S.cart.reduce((a,l)=>a+l.qty,0);
const subtotal = () => S.cart.reduce((a,l)=>a+l.qty*l.unit,0);
const fee = () => S.mode==='entrega' ? CONFIG.taxaEntrega : 0;
const qtyOf = id => S.cart.filter(l=>l.itemId===id).reduce((a,l)=>a+l.qty,0);

function lineDetails(it, sel){
  const out=[];
  it.groups.forEach(g=>{const picked=(sel[g.id]||[]).map(i=>g.choices[i]);if(!picked.length)return;
    if(g.type==='one') out.push(`${g.label}: ${picked[0].label}`); else picked.forEach(c=>out.push(`+ ${c.label}`))});
  return out;
}
function unitPrice(it, sel){return it.preco + it.groups.reduce((a,g)=>a+(sel[g.id]||[]).reduce((b,i)=>b+g.choices[i].price,0),0)}
function defaults(it){const sel={};it.groups.forEach(g=>{sel[g.id]=g.type==='one'?[Math.max(0,g.choices.findIndex(c=>c.def))]:[]});return sel}
function addLine(it, sel, qty, note){
  const key=it.id+'|'+JSON.stringify(sel)+'|'+note.trim();
  const ex=S.cart.find(l=>l.key===key);
  if(ex) ex.qty+=qty; else S.cart.push({key,itemId:it.id,sel,qty,note:note.trim(),unit:unitPrice(it,sel),details:lineDetails(it,sel)});
  save();
}

/* ---------- Mensagem do WhatsApp ---------- */
function message(){
  const L=[`*Novo pedido · ${CONFIG.restaurante}*`,''];
  S.cart.forEach(l=>{const it=byId(l.itemId);L.push(`*${l.qty}x ${it.nome}* · ${brl(l.qty*l.unit)}`);l.details.forEach(d=>L.push(`   ${d}`));if(l.note)L.push(`   Obs.: ${l.note}`);});
  L.push('',`Subtotal: ${brl(subtotal())}`);
  if(fee()) L.push(`Taxa de entrega: ${brl(fee())}`);
  L.push(`*Total: ${brl(subtotal()+fee())}*`,'');
  if(S.mode==='mesa') L.push(`📍 *Consumo no local · Mesa ${S.mesa.trim()}*`);
  if(S.mode==='retirada') L.push(`🛍️ *Retirada no balcão*`,`Nome: ${S.nome.trim()}`);
  if(S.mode==='entrega') L.push(`🛵 *Entrega*`,`Nome: ${S.nome.trim()}`,`Endereço: ${S.endereco.trim()}`,`Pagamento: ${S.pagamento}`);
  if(S.obs.trim()) L.push('',`Observações: ${S.obs.trim()}`);
  return L.join('\n');
}
const waLink = () => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(message())}`;
const waPreview = t => esc(t).replace(/\*([^*\n]+)\*/g,'<b>$1</b>');

/* ---------- Componentes ---------- */
const hasExtras = it => it.groups.some(g=>g.choices.some(c=>c.price));
function card(it){
  const q=qtyOf(it.id);
  return `<article class="card">
    <button class="ph" data-act="open" data-id="${it.id}" aria-label="Ver ${esc(it.nome)}"><img src="${foto(it.id)}" alt="" loading="lazy" decoding="async">
      ${it.tag?`<span class="flag">${esc(it.tag)}</span>`:''}${q?`<span class="inbag num">${q} no pedido</span>`:''}</button>
    <div class="cb">
      <button class="ct" data-act="open" data-id="${it.id}"><h3>${esc(it.nome)}</h3><p>${esc(it.desc)}</p>
        <span class="price num">${hasExtras(it)?'<small>a partir de </small>':''}${brl(it.preco)}</span></button>
      <button class="add" data-act="quick" data-id="${it.id}" aria-label="Adicionar ${esc(it.nome)}">${ico('plus',2.4)}</button>

}

/* ---------- Detalhe do item ---------- */
let D=null;
function openItem(id){const it=byId(id);D={it,sel:defaults(it),qty:1,note:''};renderSheet()}
function closeSheet(){D=null;renderSheet()}
function renderSheet(){
  const el=document.getElementById('sheet');
  if(!D){el.innerHTML='';document.body.style.overflow='';return}
  const it=D.it;document.body.style.overflow='hidden';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title"><div class="scrim" data-act="closeSheet"></div>
   <form class="panel" id="dform">
    <div class="scroll">
      <div class="hero"><img src="${foto(it.id)}" alt="${esc(it.nome)}"><span class="grab"></span><button type="button" class="close" data-act="closeSheet" aria-label="Fechar">${ico('close',2.2)}</button></div>
      <div class="dhead"><h2 id="d-title" class="disp">${esc(it.nome)}</h2><p>${esc(it.desc)}</p><div class="price num">${brl(it.preco)}</div></div>
      ${it.groups.map(g=>`<fieldset><legend>${g.label}<small class="${g.type==='one'?'req':''}">${g.type==='one'?'Escolha 1':'Opcional'}</small></legend><div class="opts">
        ${g.choices.map((c,i)=>`<label class="opt"><span>${esc(c.label)}</span>${c.price?`<em class="num">+ ${brl(c.price)}</em>`:''}<input type="${g.type==='one'?'radio':'checkbox'}" name="${g.id}" value="${i}"${(D.sel[g.id]||[]).includes(i)?' checked':''}></label>`).join('')}</div></fieldset>`).join('')}
      <label class="fl" for="d-note">Alguma observação? <span>(opcional)</span></label>
      <textarea id="d-note" name="note" placeholder="Ex.: sem cebola, molho à parte">${esc(D.note)}</textarea>
    </div>
    <div class="foot" id="dfoot"></div>
   </form></div>`;
  renderFoot();
  const f=document.getElementById('dform');
  f.addEventListener('change',()=>{it.groups.forEach(g=>D.sel[g.id]=[...f.querySelectorAll(`input[name="${g.id}"]:checked`)].map(x=>+x.value));renderFoot()});
  f.addEventListener('input',ev=>{if(ev.target.name==='note')D.note=ev.target.value});
  f.addEventListener('submit',ev=>{ev.preventDefault();addLine(it,D.sel,D.qty,D.note);const n=D.qty;closeSheet();render(true);toast(`${n}x ${it.nome} no pedido`)});
}
function renderFoot(){
  document.getElementById('dfoot').innerHTML=`<div class="stepper"><button type="button" data-act="dq" data-d="-1" aria-label="Diminuir quantidade"${D.qty<2?' disabled':''}>${ico('minus',2.2)}</button><output class="num" aria-live="polite">${D.qty}</output><button type="button" data-act="dq" data-d="1" aria-label="Aumentar quantidade">${ico('plus',2.2)}</button></div>
  <button type="submit" class="primary"><span>Adicionar</span><span class="num">${brl(unitPrice(D.it,D.sel)*D.qty)}</span></button>`;
}

/* ---------- Parte de baixo: sacola flutuante + navegação ---------- */
function renderDock(bump){
  const dock=document.getElementById('dock');
  if(S.view==='cart'&&S.cart.length){dock.innerHTML=`<div class="fixedcta"><div class="dock-in"><button class="primary" data-act="review"><span>Revisar e enviar</span><span class="num">${brl(subtotal()+fee())}</span></button></div></div>`;return}
  if(S.view==='confirm'){dock.innerHTML=`<div class="fixedcta"><div class="dock-in"><a class="wa" href="${waLink()}" target="_blank" rel="noopener" data-act="sent">${ico('chat',1.8)}Enviar pedido pelo WhatsApp</a></div></div>`;return}
  if(S.view==='cart'){dock.innerHTML='';return}
  const n=count(), tabs=[['home','Início']].concat(CATS.map(c=>[c.id,c.nome]));
  dock.innerHTML=`<div class="dock"><div class="dock-in fabwrap">
     <button class="fab${n?'':' empty'}${bump?' bump':''}" data-act="cart" aria-label="Ver pedido, ${n} ${n===1?'item':'itens'}">${ico('bag',2)}${n?`<span class="num">${brl(subtotal())}</span>`:''}<span class="badge num">${n}</span></button></div>
   <nav class="tabs" aria-label="Categorias"><div class="dock-in">${tabs.map(([id,label])=>{const on=id==='home'?S.view==='home':S.view==='list'&&S.cat===id;
     return `<button data-act="${id==='home'?'home':'cat'}" data-id="${id}"${on?' aria-current="page"':''}><span class="ico">${ico(id)}</span>${label}</button>`}).join('')}</div></nav></div>`;
}

function render(bump){
  const app=document.getElementById('app');
  app.className=(S.view==='cart'||S.view==='confirm')?'nonav':'';
  app.innerHTML={home:vHome,list:vList,cart:vCart,confirm:vConfirm}[S.view]();
  renderDock(bump);
}
function go(view,extra){Object.assign(S,{view},extra||{});S.errors={};render();window.scrollTo(0,0)}
let tt;function toast(t){const el=document.getElementById('toast');el.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(tt);tt=setTimeout(()=>el.innerHTML='',1800)}

function validate(){
  const e={};
  if(S.mode==='mesa'&&!S.mesa.trim()) e.mesa='Informe o número da mesa (fica na plaquinha em cima dela).';
  if(S.mode!=='mesa'&&!S.nome.trim()) e.nome='Diga seu nome para a gente identificar o pedido.';
  if(S.mode==='entrega'&&S.endereco.trim().length<8) e.endereco='Coloque o endereço completo: rua, número e bairro.';
  S.errors=e;return !Object.keys(e).length;
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='home') go('home');
  else if(a==='cat') go('list',{cat:b.dataset.id});
  else if(a==='open') openItem(b.dataset.id);
  else if(a==='quick'){const it=byId(b.dataset.id);
    if(it.groups.length) openItem(it.id); else {addLine(it,{},1,'');const y=scrollY;render(true);scrollTo(0,y);toast(`${it.nome} no pedido`)}}
  else if(a==='closeSheet') closeSheet();
  else if(a==='dq'){D.qty=Math.max(1,D.qty+ +b.dataset.d);renderFoot()}
  else if(a==='cart') go('cart');
  else if(a==='back') go(S.cart.length?'list':'home');
  else if(a==='lq'){const l=S.cart[+b.dataset.i];l.qty+= +b.dataset.d;if(l.qty<1)S.cart.splice(+b.dataset.i,1);save();const y=scrollY;render();scrollTo(0,y)}
  else if(a==='mode'){S.mode=b.dataset.m;S.errors={};save();const y=scrollY;render();scrollTo(0,y)}
  else if(a==='review'){if(validate())go('confirm',{sent:false});else{render();const f=document.querySelector('.err');if(f){f.previousElementSibling.focus();f.scrollIntoView({block:'center'})}}}
  else if(a==='sent'){S.sent=true;setTimeout(()=>{document.getElementById('app').innerHTML=vConfirm()},400)}
  else if(a==='copy'){const t=message(),done=()=>toast('Mensagem copiada');
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('preview'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto selecionado, é só copiar')};
    try{navigator.clipboard.writeText(t).then(done,fallback)}catch(e){fallback()}}
  else if(a==='reset'){S.cart=[];S.obs='';S.sent=false;save();go('home')}
});
document.addEventListener('input',ev=>{const f=ev.target.dataset&&ev.target.dataset.f;if(f){S[f]=ev.target.value;if(S.errors[f]){delete S.errors[f];const er=ev.target.nextElementSibling;if(er&&er.classList.contains('err'))er.remove()}save()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&D)closeSheet()});

render();
</script>
</body>
</html>
